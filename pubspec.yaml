name: flash_note
description: 闪记 - 随时记录工作生活，AI 智能分析，自动提醒

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 本地数据库
  drift: ^2.21.0
  drift_flutter: 0.2.6
  sqlite3_flutter_libs: ^0.5.0

  # 路由
  go_router: ^14.2.0

  # 语音识别（离线）
  speech_to_text: ^7.3.0

  # 录音
  record: ^6.0.0

  # 音频播放
  audioplayers: ^6.0.0

  # 文件选择 / 存储
  path_provider: ^2.1.3
  path: ^1.9.0

  # 权限
  permission_handler: ^11.3.1

  # 本地通知（提醒）
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # HTTP（调用用户配置的大模型 API）
  http: ^1.2.1
  dio: ^5.4.3

  # JSON 序列化
  json_annotation: ^4.9.0

  # 工具
  uuid: ^4.3.3
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  flutter_markdown: ^0.7.3

  # 图片选择
  image_picker: ^1.1.2

  # 分享
  share_plus: ^10.1.2

  # URL 启动（Feishu/外部 App）
  url_launcher: ^6.3.0

  # UI 组件
  flutter_slidable: ^3.1.0
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.21.0
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/


